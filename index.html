<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title></title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #05060a; }

  #stage { position: fixed; inset: 0; }
  canvas { display: block; }

  /* 背景暗色渐变 + 中心柔光 */
  #glow {
    position: fixed; inset: 0; pointer-events: none;
    background:
      radial-gradient(circle at 50% 46%, rgba(120, 20, 45, 0.55), transparent 55%),
      radial-gradient(circle at 50% 50%, rgba(20, 5, 15, 0.6), transparent 70%),
      linear-gradient(#05060a, #0a0610);
  }

  /* 表白文字 */
  #text {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    transform: translateY(24vh);
    color: #fff;
    font-family: "Kaiti SC", "STKaiti", "KaiTi", "SimSun", serif;
    font-weight: 600;
    font-size: clamp(40px, 10vw, 100px);
    letter-spacing: 0.16em;
    text-shadow:
      0 0 18px rgba(255, 90, 130, 0.95),
      0 0 50px rgba(255, 60, 110, 0.7),
      0 0 110px rgba(255, 40, 90, 0.5);
    opacity: 0;
    pointer-events: none;
    animation: appear 2.4s ease forwards 3.1s, breathe 4s ease-in-out infinite 5.5s;
  }

  @keyframes appear {
    from { opacity: 0; transform: translateY(24vh) scale(0.92); filter: blur(6px); }
    to   { opacity: 1; transform: translateY(24vh) scale(1);    filter: blur(0); }
  }
  @keyframes breathe {
    0%, 100% { text-shadow: 0 0 18px rgba(255,90,130,.95), 0 0 50px rgba(255,60,110,.7), 0 0 110px rgba(255,40,90,.5); }
    50%      { text-shadow: 0 0 26px rgba(255,120,150,1), 0 0 70px rgba(255,80,120,.85), 0 0 150px rgba(255,50,100,.65); }
  }
</style>
</head>
<body>
  <div id="glow"></div>
  <canvas id="stage"></canvas>
  <div id="text"></div>

<script>
(function () {
  "use strict";

  const canvas = document.getElementById("stage");
  const ctx = canvas.getContext("2d");

  let W = 0, H = 0, DPR = 1;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  /* ================= 玫瑰：分层花瓣点云 ================= */

  // 每层：baseR 花瓣根部离中心半径 / len 花瓣长度 / width 半宽 /
  //       tilt 外翻角度(越大越张开) / rise 上扬 / n 花瓣数 / y0 层高
  const LAYERS = [
    { baseR: 0.16, len: 0.62, width: 0.34, tilt:  0.52, rise: 0.52, n: 8, y0: -0.08 }, // 最外圈：盛开
    { baseR: 0.12, len: 0.54, width: 0.30, tilt:  0.34, rise: 0.55, n: 7, y0:  0.00 },
    { baseR: 0.08, len: 0.44, width: 0.25, tilt:  0.16, rise: 0.60, n: 6, y0:  0.07 },
    { baseR: 0.04, len: 0.34, width: 0.19, tilt: -0.02, rise: 0.66, n: 6, y0:  0.14 },
    { baseR: 0.015,len: 0.24, width: 0.13, tilt: -0.18, rise: 0.74, n: 5, y0:  0.20 }  // 花心：含苞
  ];

  // 每层颜色 (深红 -> 亮粉)
  const COLORS = [
    [186, 34, 66],
    [214, 44, 84],
    [232, 66, 104],
    [244, 100, 130],
    [255, 168, 188]
  ];

  const rawPoints = [];   // 目标位置(局部坐标) + 颜色

  function buildRose() {
    LAYERS.forEach(function (layer, li) {
      const col = COLORS[li];
      const NU = 22, NW = 12;   // 沿花瓣长/宽采样
      for (let k = 0; k < layer.n; k++) {
        const yaw = (k / layer.n) * Math.PI * 2 + li * 0.22; // 层间错开
        for (let i = 0; i <= NU; i++) {
          const u = i / NU;                                    // 0 根部 -> 1 尖端
          const hw = layer.width * Math.sin(Math.PI * Math.pow(u, 0.85)); // 宽度剖面
          for (let j = 0; j <= NW; j++) {
            const w = -1 + (2 * j) / NW;                       // -1 左缘 -> 1 右缘

            // 花瓣局部坐标（z 朝外、y 朝上、x 为宽）
            let x = w * hw;
            let y = Math.pow(u, 1.2) * layer.len * layer.rise
                  - Math.pow(u, 4) * layer.len * 0.10;
            let z = u * layer.len * 0.88 + Math.pow(u, 2) * layer.len * 0.35;

            // 横向凹陷成杯状，边缘微微卷起
            y += (w * w) * hw * 0.32;

            // 绕 X 轴外翻（tilt>0 张开 / <0 收拢）
            const ct = Math.cos(layer.tilt), st = Math.sin(layer.tilt);
            const y2 = y * ct - z * st;
            const z2 = y * st + z * ct;

            // 平移到花瓣根部，再绕 Y 轴布置
            const y3 = y2 + layer.y0;
            const z3 = z2 + layer.baseR;
            const cy = Math.cos(yaw), sy = Math.sin(yaw);

            const px = x * cy + z3 * sy;
            const pz = -x * sy + z3 * cy;
            const py = y3;

            // 轻微抖动，让表面更密实自然
            const jit = 0.012;
            rawPoints.push({
              x: px + (Math.random() - 0.5) * jit,
              y: py + (Math.random() - 0.5) * jit,
              z: pz + (Math.random() - 0.5) * jit,
              // 尖端更亮
              c: [col[0], col[1], col[2], u]
            });
          }
        }
      }
    });
  }
  buildRose();

  // 控制总量（弱机降档）
  const MAX_PARTICLES = Math.min(rawPoints.length, 6000);
  const targets = [];
  {
    const step = rawPoints.length / MAX_PARTICLES;
    for (let i = 0; i < MAX_PARTICLES; i++) {
      targets.push(rawPoints[Math.floor(i * step)]);
    }
  }

  /* ================= 预渲染光点精灵 ================= */

  function makeSprite(r, g, b) {
    const s = 40, c = document.createElement("canvas");
    c.width = c.height = s;
    const g2 = c.getContext("2d");
    const grad = g2.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
    grad.addColorStop(0.0, "rgba(" + r + "," + g + "," + b + ",0.95)");
    grad.addColorStop(0.35, "rgba(" + r + "," + g + "," + b + ",0.55)");
    grad.addColorStop(0.7, "rgba(" + r + "," + g + "," + b + ",0.15)");
    grad.addColorStop(1.0, "rgba(" + r + "," + g + "," + b + ",0)");
    g2.fillStyle = grad;
    g2.fillRect(0, 0, s, s);
    return c;
  }
  // 颜色分级（按 u 亮度分档）
  const sprites = COLORS.map(function (c) {
    return makeSprite(c[0], c[1], c[2]);
  });
  const brightSprite = makeSprite(255, 190, 205); // 高亮尖端

  /* ================= 粒子 ================= */

  const particles = targets.map(function (t, idx) {
    // 起点：随机散落在包围球上
    const r = 5 + Math.random() * 8;
    const th = Math.random() * Math.PI * 2;
    const ph = Math.acos(2 * Math.random() - 1);
    return {
      sx: r * Math.sin(ph) * Math.cos(th),
      sy: r * Math.sin(ph) * Math.sin(th),
      sz: r * Math.cos(ph),
      tx: t.x, ty: t.y, tz: t.z,
      r: t.c[0], g: t.c[1], b: t.c[2], tip: t.c[3],
      sprite: t.c[3] > 0.78 ? brightSprite : sprites[Math.min(4, Math.floor(t.c[3] / 0.2))],
      delay: Math.random() * 0.9,   // 汇聚延迟
      x: 0, y: 0, z: 0
    };
  });

  /* ================= 星空 ================= */

  const stars = [];
  for (let i = 0; i < 180; i++) {
    stars.push({
      x: Math.random(), y: Math.random(),
      r: 0.4 + Math.random() * 1.4,
      ph: Math.random() * Math.PI * 2,
      sp: 0.5 + Math.random() * 1.5
    });
  }

  /* ================= 飘浮光点 ================= */

  const fireflies = [];
  for (let i = 0; i < 26; i++) {
    fireflies.push({
      x: Math.random(), y: Math.random(),
      r: 1 + Math.random() * 2.4,
      vx: (Math.random() - 0.5) * 0.0003,
      vy: -(0.0001 + Math.random() * 0.00025),
      ph: Math.random() * Math.PI * 2
    });
  }

  /* ================= 动画 ================= */

  const ASSEMBLE_DUR = 2.6;      // 单个粒子从起点飞到目标耗时(秒)
  const SPREAD = 1.4;            // 最后粒子开始汇聚的延迟窗口(秒)

  let spin = 0.6;                // 当前旋转角
  let startTime = performance.now();

  function easeOutCubic(t) {
    return 1 - Math.pow(1 - t, 3);
  }

  function draw(time) {
    const t = (time - startTime) / 1000;
    spin += 0.0042;              // 缓慢旋转

    // 呼吸浮动
    const bob = Math.sin(t * 0.7) * 0.05;

    ctx.clearRect(0, 0, W, H);

    /* --- 星空 --- */
    ctx.save();
    for (let i = 0; i < stars.length; i++) {
      const s = stars[i];
      const a = 0.35 + 0.45 * Math.sin(t * s.sp + s.ph);
      ctx.globalAlpha = a;
      ctx.fillStyle = "#cfd6ff";
      ctx.fillRect(s.x * W, s.y * H, s.r, s.r);
    }
    ctx.restore();

    /* --- 玫瑰粒子 --- */
    const cx = W / 2, cy = H / 2;
    const unit = Math.min(W, H) * 0.52;         // 玫瑰整体缩放
    const cosSpin = Math.cos(spin), sinSpin = Math.sin(spin);
    const viewTilt = 0.22;                       // 略俯视
    const ct = Math.cos(viewTilt), st = Math.sin(viewTilt);
    const perspF = 3.4;

    ctx.globalCompositeOperation = "lighter";    // 叠加发光

    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      const k = Math.min(Math.max((t - p.delay * SPREAD) / ASSEMBLE_DUR, 0), 1);
      const e = easeOutCubic(k);

      // 目标随旋转
      const tx = p.tx, ty = p.ty + bob, tz = p.tz;
      const rx = tx * cosSpin + tz * sinSpin;
      const rz = -tx * sinSpin + tz * cosSpin;
      const ry2 = ty * ct - rz * st;
      const rz2 = ty * st + rz * ct;

      // 当前 = 起点到(已旋转)目标的插值
      const sxx = p.sx * cosSpin + p.sz * sinSpin;
      const szz = -p.sx * sinSpin + p.sz * cosSpin;
      const sy2 = p.sy * ct - szz * st;
      const sz2 = p.sy * st + szz * ct;

      const x = sxx + (rx - sxx) * e;
      const y = sy2 + (ry2 - sy2) * e;
      const z = sz2 + (rz2 - sz2) * e;

      const persp = perspF / (perspF + z);
      const sx = cx + x * unit * persp;
      const sy = cy - y * unit * persp;

      const size = (1.6 + p.tip * 1.6) * persp * (DPR * 0.9);
      const alpha = Math.min(1, 0.35 + persp * 0.8);

      ctx.globalAlpha = alpha;
      ctx.drawImage(p.sprite, sx - size / 2, sy - size / 2, size, size);
    }

    /* --- 飘浮光点 --- */
    ctx.globalCompositeOperation = "lighter";
    for (let i = 0; i < fireflies.length; i++) {
      const f = fireflies[i];
      f.x += f.vx; f.y += f.vy;
      if (f.y < -0.02) { f.y = 1.02; f.x = Math.random(); }
      if (f.x < -0.02) f.x = 1.02;
      if (f.x > 1.02) f.x = -0.02;
      const a = 0.25 + 0.45 * Math.sin(t * 2 + f.ph);
      ctx.globalAlpha = a;
      ctx.fillStyle = "#ffe0ec";
      ctx.beginPath();
      ctx.arc(f.x * W, f.y * H, f.r, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";

    requestAnimationFrame(draw);
  }

  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
